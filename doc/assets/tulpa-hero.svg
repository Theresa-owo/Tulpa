<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="tulpa-title tulpa-description">
  <title id="tulpa-title">Tulpa — 把 QQ、微信与哔哩哔哩接入你的 Agent</title>
  <desc id="tulpa-description">米白与深墨色的 Tulpa MCP 项目首页横幅。左侧为 Tulpa 品牌与产品介绍，右侧展示 QQ、微信、哔哩哔哩模块通过精细授权汇入 Tulpa MCP，再连接 Codex、Claude Code 等桌面 Agent。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.58" stop-color="#faf9f5"/>
      <stop offset="1" stop-color="#f8f7f1"/>
    </linearGradient>
    <linearGradient id="dark-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282823"/>
      <stop offset="0.75" stop-color="#171714"/>
      <stop offset="1" stop-color="#10100e"/>
    </linearGradient>
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#c8c4b9" opacity="0.34"/>
    </pattern>
    <clipPath id="rounded-root">
      <rect width="1200" height="400" rx="26"/>
    </clipPath>
    <style>
      .ui {font-family: "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei UI", Arial, sans-serif;}
      .mono {font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;}
      .ink {fill:#171714;}
      .muted {fill:#73726c;}
      .small {font-size:12px;}
      .source-title {font-size:19px;font-weight:680;letter-spacing:-.35px;}
      .source-detail {font-size:12px;fill:#73726c;}
      .agent-title {font-size:14px;font-weight:650;}
    </style>
  </defs>

  <g clip-path="url(#rounded-root)">
    <rect width="1200" height="400" fill="url(#paper)"/>
    <rect x="618" y="28" width="554" height="343" rx="22" fill="#f0eee6"/>
    <rect x="633" y="42" width="525" height="315" rx="16" fill="url(#dot-grid)" opacity="0.42"/>
    <path d="M618 68V331" stroke="#d9d5cb" stroke-width="1" opacity=".75"/>
    <circle cx="1170" cy="20" r="115" fill="#e9e6dc" opacity="0.30"/>
    <circle cx="-24" cy="416" r="139" fill="#edeae1" opacity="0.28"/>

    <!-- The compact Tulpa emblem echoes the native application's speech-bubble mark. -->
    <g id="brand-mark" transform="translate(64 61)">
      <rect width="49" height="49" rx="11" fill="#171714"/>
      <path d="M15 35l-3 4 1-8C7 24 9 13 18 11c10-3 21 1 22 12 2 11-7 18-18 16" fill="none" stroke="#faf9f5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 16c6-3 17-1 18 8 1 8-5 11-12 11l-6 4 1-7c-5-3-6-12-1-16z" fill="none" stroke="#faf9f5" stroke-width="1.65" stroke-linejoin="round" opacity=".92"/>
      <path d="M23 24h9M23 28h6" fill="none" stroke="#faf9f5" stroke-width="1.55" stroke-linecap="round"/>
    </g>
    <text class="mono muted" x="129" y="80" font-size="12.5" letter-spacing="2.1">TULPA  /  MCP CONNECTOR</text>
    <text class="ui muted" x="129" y="100" font-size="11.5" letter-spacing=".4">LOCAL CONTEXT · SCOPED ACCESS</text>

    <g id="headline">
      <text class="ui ink" x="60" y="205" font-size="99" font-weight="760" letter-spacing="-5.5">Tulpa</text>
      <rect x="65" y="222" width="92" height="5" rx="2.5" fill="#171714"/>
      <rect x="163" y="222" width="27" height="5" rx="2.5" fill="#aaa594"/>
      <rect x="196" y="222" width="10" height="5" rx="2.5" fill="#d4d0c5"/>
      <text class="ui ink" x="64" y="267" font-size="25" font-weight="650" letter-spacing="-.5">让 Agent 走进你的数字生活。</text>
      <text class="ui" x="65" y="302" font-size="16.5" fill="#505049">连接 QQ、微信与 B站，理解内容，也参与群聊。</text>
      <text class="ui muted" x="65" y="328" font-size="13.5">本地数据读取　·　精细权限控制　·　统一 MCP 接口</text>
    </g>

    <g id="platform-tags" class="mono" font-size="11.5">
      <g transform="translate(65 349)">
        <rect width="133" height="30" rx="15" fill="#f0eee6" stroke="#dedbd2"/>
        <circle cx="15" cy="15" r="3.3" fill="#68675e"/>
        <text x="27" y="19.3" fill="#4e4d47">Windows x64</text>
      </g>
      <g transform="translate(207 349)">
        <rect width="218" height="30" rx="15" fill="#f0eee6" stroke="#dedbd2"/>
        <circle cx="15" cy="15" r="3.3" fill="#68675e"/>
        <text x="27" y="19.3" fill="#4e4d47">Linux x86_64 / ARM64</text>
      </g>
      <g transform="translate(434 349)">
        <rect width="102" height="30" rx="15" fill="#f0eee6" stroke="#dedbd2"/>
        <circle cx="15" cy="15" r="3.3" fill="#68675e"/>
        <text x="27" y="19.3" fill="#4e4d47">MCP READY</text>
      </g>
    </g>

    <!-- Right side: three independently authorized data surfaces, one MCP gateway. -->
    <g id="system-diagram">
      <text class="mono muted" x="648" y="65" font-size="11.5" letter-spacing="1.7">THREE MODULES. ONE CONNECTION.</text>
      <g aria-hidden="true" transform="translate(1105 54)">
        <circle cx="0" cy="7" r="3" fill="#171714"/>
        <circle cx="12" cy="7" r="3" fill="#a5a091"/>
        <circle cx="24" cy="7" r="3" fill="#d4cfc3"/>
      </g>

      <g id="sources">
        <g transform="translate(648 84)">
          <rect width="151" height="77" rx="11" fill="#faf9f5" stroke="#d8d5cb"/>
          <path d="M18 16h14c5 0 8 3 8 8v3c0 5-3 8-8 8h-5l-6 5v-5h-3c-5 0-8-3-8-8v-3c0-5 3-8 8-8z" fill="none" stroke="#171714" stroke-width="1.6" stroke-linejoin="round" transform="translate(4 -1) scale(.69)"/>
          <text class="ui source-title ink" x="53" y="30">QQ</text>
          <path d="M14 46h123" stroke="#e8e5dc"/>
          <text class="ui source-detail" x="14" y="64">历史消息 · 实时群聊</text>
        </g>
        <g transform="translate(819 84)">
          <rect width="151" height="77" rx="11" fill="#faf9f5" stroke="#d8d5cb"/>
          <path d="M16 13c-5 0-9 4-9 9 0 4 3 7 6 8v5l6-4h2c5 0 9-4 9-9s-4-9-9-9z M28 19c7 0 12 4 12 10 0 3-2 5-4 7v4l-5-3h-3" fill="none" stroke="#171714" stroke-width="1.4" stroke-linejoin="round" transform="translate(6 1) scale(.73)"/>
          <text class="ui source-title ink" x="53" y="30">微信</text>
          <path d="M14 46h123" stroke="#e8e5dc"/>
          <text class="ui source-detail" x="14" y="64">本地资料 · 消息溯源</text>
        </g>
        <g transform="translate(990 84)">
          <rect width="151" height="77" rx="11" fill="#faf9f5" stroke="#d8d5cb"/>
          <g transform="translate(15 14)" stroke="#171714" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="0" y="6" width="27" height="19" rx="5"/>
            <path d="M7 6L4 1M20 6l4-5M9 14h0M18 14h0M10 19h9"/>
          </g>
          <text class="ui source-title ink" x="53" y="30">B站</text>
          <path d="M14 46h123" stroke="#e8e5dc"/>
          <text class="ui source-detail" x="14" y="64">视频 · 字幕 · 评论</text>
        </g>
      </g>

      <g id="incoming-paths" stroke="#a7a397" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true">
        <path d="M723.5 161v12q0 6 6 6h166"/>
        <path d="M894.5 161v23"/>
        <path d="M1065.5 161v12q0 6-6 6h-165"/>
      </g>
      <circle cx="894.5" cy="179" r="3.2" fill="#171714"/>
      <path d="M891 180l3.5 4 3.5-4" stroke="#171714" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <g id="mcp-core">
        <rect x="648" y="188" width="493" height="104" rx="14" fill="url(#dark-card)"/>
        <rect x="648.6" y="188.6" width="491.8" height="102.8" rx="13.5" fill="none" stroke="#56554e" stroke-opacity=".55" stroke-width="1.2"/>
        <g transform="translate(667 204)" fill="none" stroke="#f3f1e9" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" opacity=".85">
          <rect width="24" height="24" rx="6"/>
          <path d="M6 9h12v7H11l-4 3v-3H6zM9 12h6"/>
        </g>
        <text x="702" y="221" class="mono" fill="#c6c2b7" font-size="11.5" letter-spacing="1.35">TULPA / MCP GATEWAY</text>
        <circle cx="1101" cy="216" r="3.2" fill="#a7b49e"/>
        <text x="1091" y="219.5" fill="#bcb9af" font-size="10.5" class="mono" text-anchor="end">SCOPED</text>
        <path d="M671 233H1117" stroke="#494941" stroke-opacity=".7"/>
        <text class="ui" x="670" y="258" font-size="20.5" font-weight="650" fill="#f9f8f2">读懂上下文，连接每一个 Agent</text>
        <text class="ui" x="671" y="279" font-size="12.2" fill="#c1beb4">按模块授权　·　查阅可追溯　·　由 Agent 执行任务</text>
      </g>

      <g id="outgoing-paths" stroke="#aaa69b" stroke-width="1.7" stroke-linecap="round" fill="none" aria-hidden="true">
        <path d="M894.5 292v11M723.5 312v-9h342v9" stroke-linejoin="round"/>
        <path d="M894.5 303v9"/>
      </g>

      <g id="agent-clients" class="ui">
        <g transform="translate(648 312)">
          <rect width="151" height="42" rx="10" fill="#fbfaf6" stroke="#d3d0c5"/>
          <circle cx="18" cy="21" r="4.2" fill="#171714"/>
          <text class="agent-title ink" x="32" y="26">Codex</text>
          <path d="M133 18l4 3-4 3" fill="none" stroke="#a39f93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(819 312)">
          <rect width="151" height="42" rx="10" fill="#fbfaf6" stroke="#d3d0c5"/>
          <circle cx="18" cy="21" r="4.2" fill="#171714"/>
          <text class="agent-title ink" x="32" y="26">Claude Code</text>
          <path d="M133 18l4 3-4 3" fill="none" stroke="#a39f93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(990 312)">
          <rect width="151" height="42" rx="10" fill="#fbfaf6" stroke="#d3d0c5"/>
          <circle cx="18" cy="21" r="4.2" fill="#171714"/>
          <text class="agent-title ink" x="32" y="26">MCP Clients</text>
          <path d="M133 18l4 3-4 3" fill="none" stroke="#a39f93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
  <rect x=".6" y=".6" width="1198.8" height="398.8" rx="25.4" fill="none" stroke="#dedbd2" stroke-opacity=".65" stroke-width="1.2"/>
</svg>
