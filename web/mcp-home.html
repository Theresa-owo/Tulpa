<!doctype html><html lang="zh-CN" data-desktop="true"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Tulpa MCP</title><link rel="icon" href="/ui/tulpa-logo.png">
<link rel="stylesheet" href="/ui/app.css"><link rel="stylesheet" href="/ui/desktop.css"><link rel="stylesheet" href="/ui/mcp.css"><link rel="stylesheet" href="/ui/mcp-home.css">
<script src="/ui/snowluma.js" defer></script><script src="/ui/mcp-home.js" defer></script><script src="/ui/chat.js" defer></script><script src="/ui/data.js" defer></script><script src="/ui/live.js" defer></script><script src="/ui/voice.js" defer></script><script src="/ui/mcp.js" defer></script><script src="/ui/mcp-learning.js" defer></script><script src="/ui/mcp-bilibili-login.js" defer></script>
</head><body>
<!-- shared-forms -->
<div class="shell">
<aside id="sidebar"><div class="sidebar-head"><span class="brand"><img src="/ui/tulpa-logo.png" width="32" height="32" alt=""><span>Tulpa <small>MCP</small></span></span></div>
<button id="open-data" class="nav-button"><svg><use href="#i-data"/></svg>数据与同步</button>
<button id="open-onebot" class="nav-button"><svg><use href="#i-sliders"/></svg>OneBot 设置</button>
<button id="open-bilibili" class="nav-button"><svg><use href="#i-sliders"/></svg>B站账号设置</button>
<button id="open-learning" class="nav-button"><svg><use href="#i-chat"/></svg>QQ 学习管理</button>
<button id="open-service-settings" class="nav-button"><svg><use href="#i-sliders"/></svg>服务设置</button>
<div class="sidebar-bottom"><button id="live-summary" class="live-summary" type="button">读取实时状态…</button><p class="field-hint" id="lite-version">Tulpa MCP</p></div>
</aside>
<main id="lite-main"><div class="connection-home"><button id="home-connect" class="primary-button create-connection-button"><span aria-hidden="true">＋</span>开始创建链接</button>
<details id="home-connections" class="connection-list" open><summary>已创建的链接 <span id="connection-count">0</span></summary><div id="mcp-connections" aria-live="polite"></div></details>
<p id="lite-error" role="alert"></p></div></main></div>
<dialog id="lite-onebot" class="desktop-config"><div class="dialog-head"><h2>OneBot 设置</h2><button class="close-dialog icon-button" aria-label="关闭设置">×</button></div><div class="desktop-config-body">
<div id="lite-snowluma"></div>
<details id="lite-onebot-manual"><summary>高级设置</summary>
<form id="lite-onebot-form"><label>OneBot 地址<input id="lite-onebot-url" type="url" placeholder="http://127.0.0.1:3000"></label><label>访问 Token<input id="lite-onebot-token" type="password" autocomplete="new-password" placeholder="留空保留"></label><label>实时事件地址<input id="lite-events-url" type="url" placeholder="ws://127.0.0.1:3001"></label>
<label>事件 Token<input id="lite-events-token" type="password" autocomplete="new-password" placeholder="留空保留"></label><button type="submit">保存并检测</button><button id="lite-onebot-test" type="button">检测连接</button></form>
<p id="lite-onebot-result" role="status"></p><p id="lite-onebot-current" class="config-intro"></p><a href="/api/desktop/diagnostics" download="Tulpa-diagnostics.json">导出运行诊断</a></details><label id="lite-background-label" class="desktop-check"><input id="lite-background" type="checkbox">关闭窗口后留在托盘</label></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
